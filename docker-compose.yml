# Saleswind — single stack: Postgres + Next.js app.
# Same routing pattern as docai.az: Cloudflare Tunnel -> Traefik (:80) -> app,
# routed by Host() label. The DB is internal-only (never published).
name: saleswind

services:
  db:
    image: postgres:17
    container_name: saleswind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - saleswind-db-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: saleswind-app:latest
    container_name: saleswind-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Canonical external origin so Auth.js builds correct redirects and uses
      # secure cookies (the app runs behind Cloudflare->Traefik over http).
      AUTH_URL: https://${APP_HOST}
      NODE_ENV: production
    networks:
      - default            # reach the db
      - proxy              # reached by Traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.saleswind.entrypoints=web
      - traefik.http.routers.saleswind.rule=Host(`${APP_HOST}`)
      - traefik.http.services.saleswind.loadbalancer.server.port=3000

volumes:
  saleswind-db-data:        # -> saleswind_saleswind-db-data (existing data reused)

networks:
  default:
  proxy:
    external: true          # Traefik's shared network
