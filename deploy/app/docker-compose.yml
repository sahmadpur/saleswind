# Saleswind app — same deployment pattern as docai.az on this server:
# Cloudflare Tunnel -> Traefik (:80) -> this container, routed by Host() label.
# The app joins the shared "proxy" network (Traefik) and "saleswind_default"
# (to reach the Postgres container). The DB is never exposed publicly.
name: saleswind-app

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: saleswind-app:latest
    container_name: saleswind-app
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    networks:
      - proxy
      - saleswind_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.saleswind.entrypoints=web
      - traefik.http.routers.saleswind.rule=Host(`${APP_HOST}`)
      - traefik.http.services.saleswind.loadbalancer.server.port=3000

networks:
  proxy:
    external: true            # Traefik's network (shared)
  saleswind_default:
    external: true            # created by deploy/postgres
